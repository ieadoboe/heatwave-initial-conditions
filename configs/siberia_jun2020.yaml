# Verkhoyansk / Siberia Jun 2020 — Direction A POLAR/HIGH-LATITUDE exemplar.
# Köppen: Dfd point / Dfd model cell — extreme continental subarctic, NOT a
# true E-class tundra cell (state this honestly in the paper; genuine ET
# cells are hard to anchor with a defensible T reference). Window = the core
# week around the 38.0 C WMO-verified Arctic record (Jun 20), the peak of a
# Jan-Jun prolonged anomaly (Ciavarella 2021, WWA).
# Hyperparameters = St. John's tuned values (common pipeline settings).

model_name: "v1_precip/stochastic_precip_2_8_deg.pkl"

event:
  name: siberia_jun2020
  zone: polar/high-latitude
  target_lat: 67.55
  target_lon: 133.39
  start: 2020-06-15
  peak: 2020-06-20
  end: 2020-06-25

run:
  lead_days: 6                # init 2020-06-14; evolve 11 d to event end.
  rng_seed: 42
  save_every_iters: 25

optimizer:
  name: adam
  learning_rate: 5.0e-9
  iteration_number: 75

loss:
  beta: 10
  lambda: 100
  T_ref: 286.15               # ~13 C — Verkhoyansk June characteristic T.
  target_window_days: 5
  lambda_weights:
    log_surface_pressure: 1
    divergence: 100
    vorticity: 100
    temperature_variation: 100
    specific_humidity: 50
    specific_cloud_ice_water_content: 1
    specific_cloud_liquid_water_content: 1

paths:
  era5_arco: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
  output_dir: "data/opt_runs"
  plots_dir: "plots"
