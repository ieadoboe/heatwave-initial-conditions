[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatwave-ic"
version = "0.1.0"
description = "Differentiable heat-wave initial-condition optimization with NeuralGCM (Direction A pipeline)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scipy",
    "zarr",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "optax",
    "gcsfs",
    "neuralgcm",
    "hwcat @ git+https://github.com/ieadoboe/heatwave-catalogue@v0.1.0",
]

[tool.setuptools]
packages = ["heatwave_ic"]
